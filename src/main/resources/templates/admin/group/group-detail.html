<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from themesflat.co/html/remos/add-attributes.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 02 Apr 2025 06:41:48 GMT -->
<div th:insert="~{admin/fragments/head::head}"></div>

<body class="body">

<!-- #wrapper -->
<div id="wrapper">
    <!-- #page -->
    <div id="page" class="">
        <!-- layout-wrap -->
        <div class="layout-wrap">
            <!-- preload -->
            <div id="preload" class="preload-container">
                <div class="preloading">
                    <span></span>
                </div>
            </div>
            <!-- /preload -->
            <!-- section-menu-left -->
            <div th:insert="~{admin/fragments/menu-left::section-menu-left}"></div>
            <!-- /section-menu-left -->
            <!-- section-content-right -->
            <div class="section-content-right">
                <!-- header-dashboard -->
                <div th:insert="~{admin/fragments/header_dashboard::header-dashboard}"></div>
                <!-- /header-dashboard -->
                <!-- main-content -->
                <div class="main-content">
                    <!-- main-content-wrap -->
                    <div class="main-content-inner">
                        <!-- main-content-wrap -->
                        <div class="main-content-wrap">
                            <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                <h3>Group Details</h3>
                                <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                    <li>
                                        <a th:href="@{/admin/dashboard}">
                                            <div class="text-tiny">Dashboard</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <a th:href="@{/admin/groups}">
                                            <div class="text-tiny">Groups</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <div class="text-tiny">Group Details</div>
                                    </li>
                                </ul>
                            </div>
                            <!-- group-detail -->
                            <div class="wg-box">
                                <div class="block-warning" th:if="${error}">
                                    <i class="icon-alert-octagon"></i>
                                    <div class="body-title-2" th:text="${error}"></div>
                                </div>
                                <div class="detail-info">
                                    <div class="detail-info-item">
                                        <div class="body-title">Group ID</div>
                                        <div class="body-text" th:text="${group.id}"></div>
                                    </div>
                                    <div class="detail-info-item">
                                        <div class="body-title">Group Name</div>
                                        <div class="body-text" th:text="${group.name}"></div>
                                    </div>
                                    <div class="detail-info-item">
                                        <div class="body-title">Description</div>
                                        <div class="body-text" th:text="${group.description != null && !group.description.isEmpty() ? group.description : 'No description provided'}"></div>
                                    </div>

                                    <div class="detail-info-item" th:if="${not #lists.isEmpty(group.users)}">
                                        <div class="body-title">Users in this Group</div>
                                        <div class="users-list">
                                            <table class="table-detail">
                                                <thead>
                                                    <tr>
                                                        <th>ID</th>
                                                        <th>Full Name</th>
                                                        <th>Email</th>
                                                        <th>Phone</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr th:each="user : ${group.users}">
                                                        <td th:text="${user.id}"></td>
                                                        <td th:text="${user.fullName}"></td>
                                                        <td th:text="${user.email}"></td>
                                                        <td th:text="${user.phone}"></td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div class="detail-info-item" th:if="${#lists.isEmpty(group.users)}">
                                        <div class="body-title">Users</div>
                                        <div class="body-text">No users in this group</div>
                                    </div>

                                    <div class="bot">
                                        <div></div>
                                        <div class="action-buttons">
                                            <a th:href="@{/admin/groups/edit/{id}(id=${group.id})}" class="tf-button w208">Edit Group</a>
                                            <a th:href="@{/admin/groups}" class="tf-button tf-button-alt w208 ml-10">Back to List</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- /group-detail -->
                        </div>
                        <!-- /main-content-wrap -->
                    </div>
                    <!-- /main-content-wrap -->
                    <!-- bottom-page -->
                    <div th:insert="~{admin/fragments/bottom_page::bottom-page}"></div>
                    <!-- /bottom-page -->
                </div>
                <!-- /main-content -->
            </div>
            <!-- /section-content-right -->
        </div>
        <!-- /layout-wrap -->
    </div>
    <!-- /#page -->
</div>
<!-- /#wrapper -->

<!-- Javascript -->
<div th:insert="~{admin/fragments/script::script}"></div>

<style>
.detail-info {
    padding: 20px 0;
}

.detail-info-item {
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid #e9e9e9;
}

.detail-info-item:last-child {
    border-bottom: none;
}

.table-detail {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.table-detail th, .table-detail td {
    padding: 10px;
    text-align: left;
    border: 1px solid #e9e9e9;
}

.table-detail th {
    background-color: #f7f7f7;
    font-weight: 600;
}

.action-buttons {
    display: flex;
    gap: 10px;
}

.ml-10 {
    margin-left: 10px;
}

.tf-button-alt {
    background-color: #f5f5f5;
    color: #333;
    border: 1px solid #ddd;
}

.tf-button-alt:hover {
    background-color: #e5e5e5;
}
</style>

</body>

</html>
