<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from themesflat.co/html/remos/add-attributes.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 02 Apr 2025 06:41:48 GMT -->
<div th:insert="~{admin/fragments/head::head}"></div>

<body class="body">

<!-- #wrapper -->
<div id="wrapper">
    <!-- #page -->
    <div id="page" class="">
        <!-- layout-wrap -->
        <div class="layout-wrap">
            <!-- preload -->
            <div id="preload" class="preload-container">
                <div class="preloading">
                    <span></span>
                </div>
            </div>
            <!-- /preload -->
            <!-- section-menu-left -->
            <div th:insert="~{admin/fragments/menu-left::section-menu-left}"></div>
            <!-- /section-menu-left -->
            <!-- section-content-right -->
            <div class="section-content-right">
                <!-- header-dashboard -->
                <div th:insert="~{admin/fragments/header_dashboard::header-dashboard}"></div>
                <!-- /header-dashboard -->
                <!-- main-content -->
                <div class="main-content">
                    <!-- main-content-wrap -->
                    <div class="main-content-inner">
                        <!-- main-content-wrap -->
                        <div class="main-content-wrap">
                            <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                <h3>Group information</h3>
                                <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                    <li>
                                        <a th:href="@{/admin/dashboard}">
                                            <div class="text-tiny">Dashboard</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <a th:href="@{/admin/groups}">
                                            <div class="text-tiny">Groups</div>
                                        </a>
                                    </li>
                                    <li>
                                        <i class="icon-chevron-right"></i>
                                    </li>
                                    <li>
                                        <div class="text-tiny">New group</div>
                                    </li>
                                </ul>
                            </div>
                            <!-- new-group -->
                            <div class="wg-box">
                                <div class="block-warning" th:if="${error}">
                                    <i class="icon-alert-octagon"></i>
                                    <div class="body-title-2" th:text="${error}"></div>
                                </div>
                                <div class="block-success" th:if="${success}">
                                    <i class="icon-check-circle"></i>
                                    <div class="body-title-2" th:text="${success}"></div>
                                </div>
                                <form action="/admin/groups/insert" method="post"
                                      class="form-new-product form-style-1" th:object="${group}">
                                    <fieldset class="name">
                                        <div class="body-title">Group name <span class="tf-color-1">*</span></div>
                                        <input class="flex-grow" type="text" placeholder="Group name" name="name"
                                               tabindex="0" aria-required="true" required="required"
                                               th:field="*{name}">
                                        <div class="block-warning" th:if="${#fields.hasErrors('name')}">
                                            <i class="icon-alert-octagon"></i>
                                            <div class="body-title-2" th:errors="*{name}"></div>
                                        </div>
                                    </fieldset>
                                    <fieldset class="name">
                                        <div class="body-title">Description</div>
                                        <textarea class="flex-grow" placeholder="Description" name="description"
                                                  th:field="*{description}" rows="4"></textarea>
                                        <div class="block-warning" th:if="${#fields.hasErrors('description')}">
                                            <i class="icon-alert-octagon"></i>
                                            <div class="body-title-2" th:errors="*{description}"></div>
                                        </div>
                                    </fieldset>
                                    <div class="bot">
                                        <div></div>
                                        <button class="tf-button w208" type="submit">Save</button>
                                    </div>
                                </form>
                            </div>
                            <!-- /new-group -->
                        </div>
                        <!-- /main-content-wrap -->
                    </div>
                    <!-- /main-content-wrap -->
                    <!-- bottom-page -->
                    <div th:insert="~{admin/fragments/bottom_page::bottom-page}"></div>
                    <!-- /bottom-page -->
                </div>
                <!-- /main-content -->
            </div>
            <!-- /section-content-right -->
        </div>
        <!-- /layout-wrap -->
    </div>
    <!-- /#page -->
</div>
<!-- /#wrapper -->

<!-- Javascript -->
<div th:insert="~{admin/fragments/script::script}"></div>

<script>
    // Simple form validation
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form');
        const nameInput = document.querySelector('input[name="name"]');

        form.addEventListener('submit', function(event) {
            // Validate name is not empty
            if (!nameInput.value.trim()) {
                event.preventDefault();
                alert('Group name is required!');
                nameInput.focus();
            }
        });
    });
</script>

</body>
