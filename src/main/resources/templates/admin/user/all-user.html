<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Mirrored from themesflat.co/html/remos/all-user.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 02 Apr 2025 06:42:21 GMT -->
<div th:insert="~{admin/fragments/head::head}"></div>

<body class="body">

    <!-- #wrapper -->
    <div id="wrapper">
        <!-- #page -->
        <div id="page" class="">
            <!-- layout-wrap -->
           <div class="layout-wrap">
                <!-- preload -->
                <div id="preload" class="preload-container">
                    <div class="preloading">
                        <span></span>
                    </div>
                </div>
                <!-- /preload -->
                <!-- section-menu-left -->
               <div th:insert="~{admin/fragments/menu-left::section-menu-left}"></div>
                <!-- /section-menu-left -->
                <!-- section-content-right -->
                <div class="section-content-right">
                    <!-- header-dashboard -->
                    <div th:insert="~{admin/fragments/header_dashboard::header-dashboard}"></div>
                    <!-- /header-dashboard -->
                    <!-- main-content -->
                    <div class="main-content">
                        <!-- main-content-wrap -->
                        <div class="main-content-inner">
                            <!-- main-content-wrap -->
                            <div class="main-content-wrap">
                                <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                    <h3>All User</h3>
                                    <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                        <li>
                                            <a th:href="@{/admin/dashboard}"><div class="text-tiny">Dashboard</div></a>
                                        </li>
                                        <li>
                                            <i class="icon-chevron-right"></i>
                                        </li>
                                        <li>
                                            <a th:href="@{/admin/users}"><div class="text-tiny">User</div></a>
                                        </li>
                                        <li>
                                            <i class="icon-chevron-right"></i>
                                        </li>
                                        <li>
                                            <div class="text-tiny">All User</div>
                                        </li>
                                    </ul>
                                </div>
                                <!-- all-user -->
                                <div class="wg-box">
                                    <div class="flex items-center justify-between gap10 flex-wrap">
                                        <div class="wg-filter flex-grow">
                                            <form class="form-search">
                                                <fieldset class="name">
                                                    <input type="text" placeholder="Search here..." class="search-input" name="name" tabindex="2" value="" aria-required="true" required="">
                                                </fieldset>
                                                <div class="button-submit">
                                                    <button class="" type="submit"><i class="icon-search"></i></button>
                                                </div>
                                            </form>
                                        </div>
                                        <div class="flex items-center gap10">
                                            <button id="inactiveSelectedBtn" class="tf-button style-2 w208" style="display: none;">
                                                <i class="icon-user-minus"></i>Inactive Selected
                                            </button>
                                            <a class="tf-button style-1 w208" th:href="@{/admin/users/add-new-user}"><i class="icon-plus"></i>Add new</a>
                                        </div>
                                    </div>
                                    <div class="wg-table table-all-user">
                                        <ul class="table-title flex gap20 mb-14">
                                            <li style="width: 3%; min-width: 40px;">
                                                <div class="body-title">
                                                    <input type="checkbox" id="selectAllCheckbox" class="checkbox-input">
                                                </div>
                                            </li>
                                            <li style="width: 15%; min-width: 100px;">
                                                <div class="body-title">User</div>
                                            </li>
                                            <li style="width: 15%; min-width: 100px;">
                                                <div class="body-title">Phone</div>
                                            </li>
                                            <li style="width: 25%; min-width: 150px;">
                                                <div class="body-title">Email</div>
                                            </li>
                                            <li style="width:15%; min-width: 120px;">
                                                <div class="body-title">Status</div>
                                            </li>
                                            <li style="width: 10%; min-width: 80px;">
                                                <div class="body-title">Action</div>
                                            </li>
                                        </ul>
                                        <ul class="list">
                                            <li class="user-item gap14" th:each="eachUser : ${users}">
                                                <div style="width: 3%; min-width: 40px;" class="flex items-center justify-center">
                                                    <input type="checkbox" class="user-checkbox checkbox-input" th:value="${eachUser.userId}">
                                                </div>
                                                <div class="image">
                                                    <img th:src="${eachUser.getImage()}"
                                                         alt="Ảnh người dùng mặc định">
                                                </div>
                                                <div class="flex items-center justify-between gap20 flex-grow">
                                                    <div class="name" style="width: 10%; min-width: 110px;">
                                                        <a th:href="@{/admin/users/{id}(id=${eachUser.userId})}" class="body-title-2" th:text="${eachUser.getFullName()}"></a>
                                                        <div class="text-tiny mt-3" th:text="${eachUser.getRoleName()}"></div>
                                                    </div>
                                                    <div class="body-text" style="width: 8%; min-width: 50px" th:text="${eachUser.getPhoneNumber()}"></div>
                                                    <div class="body-text" style="width: 20%; min-width: 100px" th:text="${eachUser.getEmail()}"></div>
                                                    <div class="toggle-switch" style="width: 2px;height: 20px; " th:classappend="${eachUser.actived ? 'active' : ''}"
                                                         th:attr="data-user-id=${eachUser.userId}, data-active=${eachUser.actived}">
                                                    </div>
                                                    <div class="list-icon-function" style="width: 11%">
                                                        <div class="item eye">
                                                            <a class="icon-eye" th:href="@{/admin/users/{id}(id=${eachUser.userId})}"></a>
                                                        </div>
                                                        <div class="item edit">
                                                            <a class="icon-edit" th:href="@{'/admin/users/' + ${eachUser.userId} + '?status=true'}"></a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                    <div class="divider"></div>
                                    <div class="flex items-center justify-between flex-wrap gap10">
                                        <div class="text-tiny">Showing 10 entries</div>
                                        <ul class="wg-pagination listPage">
                                        </ul>
                                    </div>
                                </div>
                                <!-- /all-user -->
                            </div>
                            <!-- /main-content-wrap -->
                        </div>
                        <!-- /main-content-wrap -->
                        <!-- bottom-page -->
                        <div th:insert="~{admin/fragments/bottom_page::bottom-page}"></div>
                        <!-- /bottom-page -->
                    </div>
                    <!-- /main-content -->
                </div>
                <!-- /section-content-right -->
            </div>
            <!-- /layout-wrap -->
        </div>
        <!-- /#page -->
    </div>
    <!-- /#wrapper -->

    <!-- CSS for checkboxes -->
    <style>
        .checkbox-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3085d6;
        }
        
        #inactiveSelectedBtn {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }
        
        #inactiveSelectedBtn:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
    </style>

    <!-- Javascript -->
    <div th:insert="~{admin/fragments/script::script}"></div>
    <script th:src="@{/admin/asset/sweetalert/sweetalert2.all.min.js}"></script>
    <script th:src="@{/admin/asset/js/pagination.js}"></script>
    <script th:src="@{/admin/asset/js/search.js}"></script>
    <script>
        $(document).ready(function () {
            // Handle individual toggle switch
            $(".toggle-switch").on("click", function () {
                const $this = $(this);
                const userId = $this.data("user-id");
                const currentState = $this.data("active") === true || $this.data("active") === "true";
                const newState = !currentState;

                Swal.fire({
                    title: "Are you sure?",
                    text: `This user will be ${newState ? 'activated' : 'deactivated'}.`,
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#3085d6",
                    cancelButtonColor: "#d33",
                    confirmButtonText: "Yes, do it!",
                    cancelButtonText: "Cancel",
                    buttonsStyling: true
                }).then((result) => {
                    if (result.isConfirmed) {
                        $.ajax({
                            url: `/admin/users/toggle-active/${userId}?active=${newState}`,
                            method: "GET",
                            success: function () {
                                Swal.fire({
                                    icon: "success",
                                    title: "Updated!",
                                    text: "User status has been updated.",
                                    confirmButtonColor: "#3085d6"
                                }).then(() => {
                                    location.reload();
                                });
                            },
                            error: function () {
                                Swal.fire({
                                    icon: "error",
                                    title: "Failed!",
                                    text: "Unable to update user status.",
                                    confirmButtonColor: "#d33"
                                });
                            }
                        });
                    }
                });
            });

            // Handle select all checkbox
            $("#selectAllCheckbox").on("change", function () {
                const isChecked = $(this).is(":checked");
                $(".user-checkbox").prop("checked", isChecked);
                updateInactiveButtonVisibility();
            });

            // Handle individual user checkbox
            $(".user-checkbox").on("change", function () {
                updateSelectAllCheckbox();
                updateInactiveButtonVisibility();
            });

            // Handle inactive selected users button
            $("#inactiveSelectedBtn").on("click", function () {
                const selectedUserIds = $(".user-checkbox:checked").map(function () {
                    return $(this).val();
                }).get();

                if (selectedUserIds.length === 0) {
                    Swal.fire({
                        icon: "warning",
                        title: "No Selection",
                        text: "Please select at least one user to inactive.",
                        confirmButtonColor: "#3085d6"
                    });
                    return;
                }

                Swal.fire({
                    title: "Are you sure?",
                    text: `This will inactive ${selectedUserIds.length} user(s).`,
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#d33",
                    cancelButtonColor: "#3085d6",
                    confirmButtonText: "Yes, inactive them!",
                    cancelButtonText: "Cancel",
                    buttonsStyling: true
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Show loading
                        Swal.fire({
                            title: "Processing...",
                            text: "Please wait while we inactive the selected users.",
                            allowOutsideClick: false,
                            didOpen: () => {
                                Swal.showLoading();
                            }
                        });

                        $.ajax({
                            url: "/admin/users/delete-multiple-users",
                            method: "POST",
                            data: {
                                ids: selectedUserIds
                            },
                            traditional: true,
                            success: function (response) {
                                Swal.fire({
                                    icon: "success",
                                    title: "Success!",
                                    text: response.message || "Users have been inactivated successfully.",
                                    confirmButtonColor: "#3085d6"
                                }).then(() => {
                                    location.reload();
                                });
                            },
                            error: function (xhr) {
                                let errorMessage = "Failed to inactive users.";
                                if (xhr.responseJSON && xhr.responseJSON.message) {
                                    errorMessage = xhr.responseJSON.message;
                                }
                                Swal.fire({
                                    icon: "error",
                                    title: "Failed!",
                                    text: errorMessage,
                                    confirmButtonColor: "#d33"
                                });
                            }
                        });
                    }
                });
            });

            function updateSelectAllCheckbox() {
                const totalCheckboxes = $(".user-checkbox").length;
                const checkedCheckboxes = $(".user-checkbox:checked").length;
                
                if (checkedCheckboxes === 0) {
                    $("#selectAllCheckbox").prop("indeterminate", false).prop("checked", false);
                } else if (checkedCheckboxes === totalCheckboxes) {
                    $("#selectAllCheckbox").prop("indeterminate", false).prop("checked", true);
                } else {
                    $("#selectAllCheckbox").prop("indeterminate", true);
                }
            }

            function updateInactiveButtonVisibility() {
                const selectedCount = $(".user-checkbox:checked").length;
                if (selectedCount > 0) {
                    $("#inactiveSelectedBtn").show();
                } else {
                    $("#inactiveSelectedBtn").hide();
                }
            }
        });
    </script>
</body>
