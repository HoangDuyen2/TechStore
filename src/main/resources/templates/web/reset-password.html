<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">

<div th:replace="web/fragments/head :: head('TechStore - Reset mật khẩu')"></div>
<body>
<!-- header-area start -->
<div th:insert="~{web/fragments/header::header}"></div>
<!-- header end -->
<div th:insert="~{web/fragments/main_menu::main-menu}"></div>
<main>
    <!-- breadcrumb start -->
    <section class="breadcrumb-area">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="breadcrumb-index">
                        <!-- breadcrumb-list start -->
                        <ul class="breadcrumb-ul">
                            <li class="breadcrumb-li">
                                <a class="breadcrumb-link" th:href="@{/home}">Home</a>
                            </li>
                            <li class="breadcrumb-li">
                                <span class="breadcrumb-text">Reset Password</span>
                            </li>
                        </ul>
                        <!-- breadcrumb-list end -->
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- breadcrumb end -->
    <!-- reset password area start -->
    <section class="customer-page section-pt">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="acc-form">
                        <div class="log-acc-page" id="ResetPasswordForm">
                            <!-- account title start -->
                            <div class="section-capture">
                                <div class="section-title">
                                    <h2 data-animate="animate__fadeInUp"><span>Reset Password</span></h2>
                                    <p data-animate="animate__fadeInUp">Nhập mật khẩu mới của bạn</p>
                                </div>
                            </div>
                            <!-- account title end -->

                            <!-- reset password form start -->
                            <div class="acc-page">
                                <div class="login">
                                    <form method="post" th:action="@{/reset-password}" th:object="${resetPasswordRequest}">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <input type="hidden" th:field="*{token}"/>
                                        
                                        <!-- Error message -->
                                        <div class="alert alert-danger" th:if="${error != null}"
                                             th:text="${error}"></div>

                                        <!-- Success message -->
                                        <div class="alert alert-success" th:if="${message != null}"
                                             th:text="${message}"></div>

                                        <div class="login-form-container">
                                            <ul class="fill-form">
                                                <!-- New password -->
                                                <li class="log-pwd" data-animate="animate__fadeInUp">
                                                    <label>New Password</label>
                                                    <input type="password" th:field="*{password}"
                                                           placeholder="Enter new password" required="required">
                                                    <span class="text-danger" th:if="${#fields.hasErrors('password')}"
                                                          th:errors="*{password}"></span>
                                                </li>

                                                <!-- Confirm password -->
                                                <li class="log-pwd" data-animate="animate__fadeInUp">
                                                    <label>Confirm New Password</label>
                                                    <input type="password" th:field="*{confirmPassword}"
                                                           placeholder="Confirm new password" required="required">
                                                    <span class="text-danger"
                                                          th:if="${#fields.hasErrors('confirmPassword')}"
                                                          th:errors="*{confirmPassword}"></span>
                                                </li>
                                            </ul>

                                            <div class="form-action-button" data-animate="animate__fadeInUp">
                                                <button type="submit" class="btn btn-style2">Reset Password</button>
                                            </div>
                                            
                                            <div class="form-action-button" data-animate="animate__fadeInUp">
                                                <a th:href="@{/login}" class="btn btn-style3">Quay lại đăng nhập</a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- reset password form end -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- reset password area end -->
    <!-- news-letter start -->
    <div th:insert="~{web/fragments/newsletter::newsletter}"></div>
    <!-- news-letter end -->
</main>
<!-- main end -->
<!-- footer start -->
<div th:insert="~{web/fragments/footer::footer}"></div>
<!-- footer end -->
<!-- mobile-menu start -->
<div class="mobile-menu" id="mobile-menu">
    <div class="mobile-contents">
        <div class="menu-close">
            <button class="menu-close-btn">
                <span class="menu-close-icon"><i class="feather-x"></i></span>
            </button>
        </div>
        <div class="header-contact">
            <div class="mobilemenu-content">
                <div class="main-wrap">
                    <ul class="main-menu">
                        <li><a href="/home">Home</a></li>
                        <li><a href="/products">Products</a></li>
                        <li><a href="/about-us">About Us</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- mobile-menu end -->
<!-- cart-drawer start -->
<div th:insert="~{web/fragments/cart_drawer::cart-drawer}"></div>
<!-- cart-drawer end -->
<!-- bottom-menu start -->
<div class="bottom-menu">
    <div class="bottom-menu-content">
        <ul class="bottom-menu-list">
            <li><a href="/home"><i class="feather-home"></i><span>Home</span></a></li>
            <li><a href="/products"><i class="feather-grid"></i><span>Products</span></a></li>
            <li><a href="/login"><i class="feather-user"></i><span>Account</span></a></li>
        </ul>
    </div>
</div>
<!-- bottom-menu end -->
<!-- fullscreen start -->
<div class="bg-screen"></div>
<!-- fullscreen end -->
<!-- back-to-top start -->
<a href="javascript:void(0)" id="top" class="scroll"><span><i class="feather-arrow-up"></i></span></a>
<!-- back-to-top end -->
<!-- plugin js -->
<script th:src="@{/web/assert/js/plugin.js}"></script>
<!-- theme js -->
<script th:src="@{/web/assert/js/main.js}"></script>
</body>
</html>
