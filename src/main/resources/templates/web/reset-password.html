<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .reset-password-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .reset-password-icon {
            color: #28a745;
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-custom {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s ease;
            width: 100%;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            color: white;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s ease;
            width: 100%;
            text-decoration: none;
            display: inline-block;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            color: white;
        }
        .password-requirements {
            font-size: 0.875rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="reset-password-card">
        <div class="reset-password-icon">
            <i class="fas fa-lock"></i>
        </div>
        
        <h2 class="mb-4">Đặt Lại Mật Khẩu</h2>
        <p class="text-muted mb-4">Nhập mật khẩu mới của bạn</p>

        <!-- Error Message -->
        <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>
        
        <!-- Success Message -->
        <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>

        <form th:action="@{/reset-password}"
              th:object="${resetPasswordRequest}"
              method="post"
              th:if="${successMessage == null and resetPasswordRequest != null}">
            <input type="hidden" th:field="*{token}">
            
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" 
                           th:field="*{newPassword}" 
                           class="form-control" 
                           placeholder="Mật khẩu mới"
                           required>
                </div>
                <div class="text-danger mt-1" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                <div class="password-requirements">
                    Mật khẩu phải từ 8-20 ký tự, chứa ít nhất 1 chữ hoa, 1 chữ thường và 1 ký tự đặc biệt
                </div>
            </div>

            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" 
                           th:field="*{confirmPassword}" 
                           class="form-control" 
                           placeholder="Nhập lại mật khẩu mới"
                           required>
                </div>
                <div class="text-danger mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn btn-custom">
                <i class="fas fa-check me-2"></i>
                Đặt Lại Mật Khẩu
            </button>
        </form>

        <!-- Show login link after successful reset -->
        <div th:if="${successMessage != null and showLoginLink}">
            <a href="/login" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>
                Đăng Nhập Ngay
            </a>
        </div>

        <div class="mt-4" th:if="${successMessage == null and resetPasswordRequest != null}">
            <a href="/login" class="text-muted">
                <i class="fas fa-arrow-left me-2"></i>
                Quay lại đăng nhập
            </a>
        </div>
        
        <!-- Show forgot password link when token is invalid -->
        <div class="mt-4" th:if="${successMessage == null and resetPasswordRequest != null}">
            <a href="/forgot-password" class="btn-login">
                <i class="fas fa-key me-2"></i>
                Yêu cầu reset mật khẩu mới
            </a>
            <br><br>
            <a href="/login" class="text-muted">
                <i class="fas fa-arrow-left me-2"></i>
                Quay lại đăng nhập
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
