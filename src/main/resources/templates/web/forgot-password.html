<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .forgot-password-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .forgot-password-icon {
            color: #667eea;
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s ease;
            width: 100%;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            color: white;
        }
        .back-to-login {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .back-to-login:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="forgot-password-card">
        <div class="forgot-password-icon">
            <i class="fas fa-key"></i>
        </div>
        
        <h2 class="mb-4">Quên Mật Khẩu?</h2>
        <p class="text-muted mb-4">Nhập email của bạn để nhận liên kết đặt lại mật khẩu</p>

        <!-- Error Message -->
        <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>
        
        <!-- Success Message -->
        <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" 
                           th:field="*{email}" 
                           class="form-control" 
                           placeholder="Nhập email của bạn"
                           required>
                </div>
                <div class="text-danger mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <button type="submit" class="btn btn-custom mb-3">
                <i class="fas fa-paper-plane me-2"></i>
                Gửi Email Đặt Lại
            </button>
        </form>

        <div class="mt-4">
            <a href="/login" class="back-to-login">
                <i class="fas fa-arrow-left me-2"></i>
                Quay lại đăng nhập
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
