<!DOCTYPE html>
<html lang="en">

<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
<head th:replace="~{web/fragments/head :: head('TechStore - Quên mật khẩu')}"></head>

<body>
<!-- top notification start -->
<div class="top-notification-bar">
    <div class="container">
        <ul class="notification-entry">
            <li class="notify-wrap notify-mail">
                <div class="notify-text">
                    <ul class="grid-wrap">
                        <li class="grid-wrapper">
                            <p class="notification-free"><span class="top-c">Free delivery</span> on orders over $100 discount</p>
                        </li>
                    </ul>
                </div>
            </li>
        </ul>
    </div>
</div>
<!-- top notification end -->

<!-- header-area start -->
<div th:insert="~{web/fragments/header::header}"></div>
<!-- header end -->
<div th:insert="~{web/fragments/main_menu::main-menu}"></div>
<main>
    <!-- breadcrumb start -->
    <section class="breadcrumb-area">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="breadcrumb-index">
                        <!-- breadcrumb-list start -->
                        <ul class="breadcrumb-ul">
                            <li class="breadcrumb-li">
                                <a class="breadcrumb-link" th:href="@{/home}">Home</a>
                            </li>
                            <li class="breadcrumb-li">
                                <span class="breadcrumb-text">Forgot Password</span>
                            </li>
                        </ul>
                        <!-- breadcrumb-list end -->
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- breadcrumb end -->
    <!-- forgot password area start -->
    <section class="customer-page section-pt">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="acc-form">
                        <div class="log-acc-page" id="ForgotPasswordForm">
                            <!-- account title start -->
                            <div class="section-capture">
                                <div class="section-title">
                                    <h2 data-animate="animate__fadeInUp"><span>Quên mật khẩu</span></h2>
                                    <p data-animate="animate__fadeInUp">Nhập email của bạn để nhận link reset mật khẩu</p>
                                </div>
                            </div>
                            <!-- account title end -->

                            <!-- forgot password form start -->
                            <div class="acc-page">
                                <div class="login">
                                    <form method="post" th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        
                                        <!-- Error message -->
                                        <div class="alert alert-danger" th:if="${error != null}"
                                             th:text="${error}"></div>

                                        <!-- Success message -->
                                        <div class="alert alert-success" th:if="${message != null}"
                                             th:text="${message}"></div>

                                        <div class="login-form-container">
                                            <ul class="fill-form">
                                                <!-- Email -->
                                                <li class="log-email" data-animate="animate__fadeInUp">
                                                    <label>Email address</label>
                                                    <input th:field="*{email}" placeholder="example@gmail.com"
                                                           autocomplete="off" required="required" type="email">
                                                    <span class="text-danger" th:if="${#fields.hasErrors('email')}"
                                                          th:errors="*{email}"></span>
                                                </li>
                                            </ul>

                                            <div class="form-action-button" data-animate="animate__fadeInUp">
                                                <button type="submit" class="btn btn-style2">Gửi email reset</button>
                                            </div>
                                            
                                            <div class="form-action-button" data-animate="animate__fadeInUp">
                                                <a th:href="@{/login}" class="btn btn-style3">Quay lại đăng nhập</a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <!-- forgot password form end -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- forgot password area end -->
    <!-- news-letter start -->
    <div th:insert="~{web/fragments/newsletter::newsletter}"></div>
    <!-- news-letter end -->
</main>
<!-- main end -->
<!-- footer start -->
<div th:insert="~{web/fragments/footer::footer}"></div>
<!-- footer end -->
<!-- mobile-menu start -->
<div class="mobile-menu" id="mobile-menu">
    <div class="mobile-contents">
        <div class="menu-close">
            <button class="menu-close-btn">
                <span class="menu-close-icon"><i class="feather-x"></i></span>
            </button>
        </div>
        <div class="header-contact">
            <div class="mobilemenu-content">
                <div class="main-wrap">
                    <ul class="main-menu">
                        <li class="menu-link">
                            <a href="#menu-home" class="link-title" data-bs-toggle="collapse" aria-expanded="false">
                                <span class="sp-link-title">Home</span>
                                <span class="menu-arrow"><i class="feather-plus"></i></span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- mobile-menu end -->
<!-- cart-drawer start -->
<div class="cart-drawer" id="cart-drawer">
    <form method="post" action="javascript:void(0)" class="drawer-contents">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="drawer-fixed-header">
            <div class="drawer-header">
                <h6 class="drawer-header-title">Cart</h6>
                <div class="drawer-close">
                    <button type="button" class="drawer-close-btn" aria-label="Close"><span class="drawer-close-icon"><i class="feather-x"></i></span></button>
                </div>
            </div>
        </div>
        <div class="drawer-cart-empty cart-unfill">
            <div class="drawer-scrollable">
                <h2>Your cart is currently empty</h2>
                <a href="collection.html" class="btn-style2">Continue shopping</a>
            </div>
        </div>
    </form>
</div>
<!-- cart-drawer end -->
<!-- bottom-menu start -->
<div class="bottom-menu">
    <ul class="bottom-menu-element">
        <li class="bottom-menu-wrap">
            <div class="bottom-menu-wrapper">
                <a href="index1.html" class="bottom-menu-home">
                    <span class="bottom-menu-icon"><i class="feather-home"></i></span>
                    <span class="bottom-menu-title">Home</span>
                </a>
            </div>
        </li>
        <li class="bottom-menu-wrap">
            <div class="bottom-menu-wrapper">
                <a href="account.html" class="bottom-menu-user">
                    <span class="bottom-menu-icon"><i class="feather-user"></i></span>
                    <span class="bottom-menu-title">Account</span>
                </a>
            </div>
        </li>
        <li class="bottom-menu-wrap">
            <div class="bottom-menu-wrapper">
                <a href="collection.html" class="bottom-menu-collection">
                    <span class="bottom-menu-icon"><i class="feather-grid"></i></span>
                    <span class="bottom-menu-title">Shop</span>
                </a>
            </div>
        </li>
        <li class="bottom-menu-wrap">
            <div class="bottom-menu-wrapper">
                <a href="wishlist.html" class="bottom-menu-wishlist">
                    <span class="bottom-menu-icon-wrap">
                        <span class="bottom-menu-icon"><i class="feather-heart"></i></span>
                        <span class="bottom-menu-counter wishlist-counter">5</span>
                    </span>
                    <span class="bottom-menu-title">Wishlist</span>
                </a>
            </div>
        </li>
        <li class="bottom-menu-wrap">
            <div class="bottom-menu-wrapper">
                <a href="javascript:void(0)" class="bottom-menu-cart">
                    <span class="bottom-menu-icon-wrap">
                        <span class="bottom-menu-icon"><i class="feather-shopping-bag"></i></span>
                        <span class="bottom-menu-counter cart-counter">4</span>
                    </span>
                    <span class="bottom-menu-title">Cart</span>
                </a>
            </div>
        </li>
    </ul>
</div>
<!-- bottom-menu end -->
<!-- fullscreen start -->
<div class="bg-screen"></div>
<!-- fullscreen end -->
<!-- back-to-top start -->
<a href="javascript:void(0)" id="top" class="scroll"><span><i class="feather-arrow-up"></i></span></a>
<!-- back-to-top end -->
<!-- plugin js -->
<script th:src="@{/web/assert/js/plugin.js}"></script>
<!-- theme js -->
<script th:src="@{/web/assert/js/main.js}"></script>
</body>
</html>
